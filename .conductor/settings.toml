# Conductor run scripts for the screenshot harness.
#
# A repo with no .conductor/settings.toml can take this file whole. One that already has a
# settings.toml must have these entries *merged* into it — a project usually has its own
# setup/run scripts, and overwriting the file would drop them. If [scripts] already exists,
# keep its existing keys and add only the two [scripts.run.*] tables below; note that
# run_mode is a single value, so an existing "concurrent" has to become "nonconcurrent" for
# the reason given under it.

"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Two screenshot runs can't share a machine: both drive the GUI, take over the frontmost window,
# and reset the same saved window frames.
run_mode = "nonconcurrent"

# Both are local-only. A run needs a Mac GUI, booted simulators, and the Screen Recording grant that
# lets the runner photograph the app's window — none of which a cloud workspace has.

[scripts.run.screenshots]
command = "\"${CONDUCTOR_WORKSPACE_PATH:-.}/Scripts/screenshots.sh\""
available_in = ["local"]
icon = "camera"

# Publish the App Store metadata without recapturing: What's New (Raw Assets/WhatsNew.txt, else written from recent commits; translated into
# every language the app ships), then the shots already taken, to App Store Connect and the app's
# page on the 256 Arts site. Writes only a version still being prepared, so it cannot alter a live
# listing. See Repos/Scripts/app-metadata; add --dry-run to see what would change.
[scripts.run.upload-app-metadata]
command = '''"$HOME/Library/Mobile Documents/com~apple~CloudDocs/Repos/Scripts/app-metadata"'''
available_in = ["local"]
icon = "cloud-upload"

# Builds the app for this Mac (native, else Catalyst, else Designed for iPad) and runs it.
[scripts.run.run]
command = '''"$HOME/Library/Mobile Documents/com~apple~CloudDocs/Repos/Scripts/run-mac"'''
available_in = ["local"]
default = true
icon = "play"
