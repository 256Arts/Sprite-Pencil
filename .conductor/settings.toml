# Conductor run scripts for the screenshot harness.
#
# A repo with no .conductor/settings.toml can take this file whole. One that already has a
# settings.toml must have these entries *merged* into it — a project usually has its own
# setup/run scripts, and overwriting the file would drop them. If [scripts] already exists,
# keep its existing keys and add only the three [scripts.run.*] tables below; note that
# run_mode is a single value, so an existing "concurrent" has to become "nonconcurrent" for
# the reason given under it.

"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Two screenshot runs can't share a machine: both drive the GUI, take over the frontmost window,
# and reset the same saved window frames.
run_mode = "nonconcurrent"

# Both are local-only. A run needs a Mac GUI, booted simulators, and the Screen Recording grant that
# lets the runner photograph the app's window — none of which a cloud workspace has.

[scripts.run.screenshots]
command = "\"${CONDUCTOR_WORKSPACE_PATH:-.}/Scripts/screenshots.sh\""
available_in = ["local"]
default = true
icon = "camera"

[scripts.run.screenshots-mac]
command = "\"${CONDUCTOR_WORKSPACE_PATH:-.}/Scripts/screenshots.sh\" mac"
available_in = ["local"]
icon = "monitor"

# Capture, then send the results to App Store Connect. Screenshots attach to an App Store version
# and only one still being prepared can be written to, so this cannot alter a live listing — if no
# version is editable it reports that and uploads nothing. Add --dry-run to see what would change.
[scripts.run.screenshots-upload]
command = "\"${CONDUCTOR_WORKSPACE_PATH:-.}/Scripts/screenshots.sh\" --upload"
available_in = ["local"]
icon = "cloud-upload"
