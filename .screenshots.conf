# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Sprite Pencil.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.spritepencil"
MAC_APP_NAME="Sprite Pencil"
PLATFORMS="iphone ipad mac vision"

# The Mac build is Mac Catalyst, which is a *variant* of the macOS platform: plain
# "platform=macOS" does not match the target.
MAC_DESTINATION="platform=macOS,variant=Mac Catalyst"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix.
SHOT_DESCRIPTIONS="
  editor     = The seeded sprite open on the canvas, the palette inspector beside it showing the
               Recent colors pulled from the sprite's own pixels
  palettes   = The palette chooser, picking which palette the editor draws from
  settings   = The Settings sheet
  canvas     = The Canvas menu open: trim, the pixel and tile grids, tiled preview, the symmetry
               guides, and importing a reference image
"

# The app's folder on the 256 Arts site. `--upload` refreshes the shots its page shows from
# the ones here, resized to the frame that page draws.
WEBSITE_SLUG="spritepencil"
