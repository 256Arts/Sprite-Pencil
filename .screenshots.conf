# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Sprite Pencil.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.spritepencil"
MAC_APP_NAME="Sprite Pencil"
PLATFORMS="iphone ipad mac vision"

# The Mac build is Mac Catalyst, which is a *variant* of the macOS platform: plain
# "platform=macOS" does not match the target.
MAC_DESTINATION="platform=macOS,variant=Mac Catalyst"
